<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste GIT</title>
</head>
<body>
    <style>
        body{
            background-color: antiquewhite;
        }
        input{
            border: none;
            border-radius: 10px;
            height: 50px;
            width: 300px;
            

        }
        button{
            width: 100px;
            margin-top: 10px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 10px;
            height: 30px;
            transition: background-color 0.3s ease;
        }
        button :hover{
            background-color: #0056b3;
            color: #ffffff;
        }

        .tit{
            background-color: aliceblue;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            position: relative; /* importante */
            z-index: 1;         /* fica mais atrás */
            }

            input{
                position: relative;
                z-index: 2;/* fica na frente do .tit */
            }
    
    </style>

    
   
    <div class="tit">
        <H1 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; ">Olá Mundo!!</H1>
    </div>
    <input type="search"><br>
    <button>Buscar</button>
   


    <footer>
        <p style="text-align: center;">&copy; 2024 Teste GIT. Todos os direitos reservados.</p>
    </footer>





</body>
</html>
