<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Login</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        background-color: antiquewhite;
        height: 100vh;
        display: flex; /* Use flexbox to center the login form*/
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    .loginpai{
        background-color: aliceblue;
        width: 350px;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .tit{
        text-align: center;
        margin-bottom: 20px;
    }
    .tit h1{
        color: #333;
    }
    input{
        width: 100%;
        height: 45px;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 15px; /* Add espaço entre os inputs */
        outline: none;
    }
    input:focus{
        border-color: #0056b3;
    }
            button {
            background: #0ea5e9;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            padding: 11px 63px;
            border: none;
            border-radius: 50px;
            box-shadow: -5px 2px 8px rgba(14, 165, 233, 0.38);
            transition: all 0.4s ease;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #0284c7;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 50px;
            box-shadow: 0px 4px 12px rgba(14, 165, 233, 0.4);
        }
    .links{
        text-align: center;
        margin-top: 15px;
    }
    .links a{
        text-decoration: none;
        color: #0056b3;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="loginpai">
    <div class="tit">
        <h1>Login</h1>
    </div>

    <form>
        <div class="input-container">
        <input type="name" id="input" required="">
        <input type="password" id="input" required="">
        <label for="input" class="label">Email</label>
        <div class="underline"></div>
        </div>

            <button type="submit">Entrar</button>
        </a>
    </form>

    <div class="links">
        <a href="#">Esqueci minha senha</a>
    </div>
</div>

</body>
</html>
